name: weatherwise
description: Weather-aware activity and movie planning client.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  cupertino_icons: ^1.0.8
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_local_notifications: ^22.3.1
  flutter_map: ^8.3.2
  flutter_svg: ^2.0.17
  flutter_timezone: ^5.1.0
  http: ^1.2.2
  latlong2: ^0.9.1
  shared_preferences: ^2.5.5
  timezone: ^0.11.1
  url_launcher: ^6.3.2
  flutter_secure_storage: ^11.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/tmdb_logo.svg
    - assets/locations/iasi/palace-of-culture-hero.jpg
    - assets/recommendations/iasi-botanical-garden.jpg
    - assets/recommendations/iasi-cinema.jpg
